name: Terraform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  TF_VERSION: "1.5.0"

jobs:
  # ==============================================================================
  # VALIDAÇÃO E FORMATAÇÃO
  # ==============================================================================
  validate:
    name: Validate & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (Dev)
        id: init
        run: terraform init -backend=false
        working-directory: environments/dev

      - name: Terraform Validate (Dev)
        id: validate
        run: terraform validate -no-color
        working-directory: environments/dev

      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `### Terraform Validation Results

            | Check | Status |
            |-------|--------|
            | Format | ${{ steps.fmt.outcome == 'success' && '✅ Passed' || '⚠️ Needs formatting' }} |
            | Init | ${{ steps.init.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Validate | ${{ steps.validate.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |

            *Run \`terraform fmt -recursive\` to fix formatting issues.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # ==============================================================================
  # ANÁLISE DE SEGURANÇA (OPCIONAL)
  # ==============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true  # Não falha o build, apenas reporta
          output_format: cli

  # ==============================================================================
  # DOCUMENTAÇÃO AUTOMÁTICA
  # ==============================================================================
  docs:
    name: Generate Docs
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Render terraform-docs
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: modules/app-infrastructure
          output-file: README.md
          output-method: inject
          git-push: "false"  # Desabilitado por padrão
