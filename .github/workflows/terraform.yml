name: Terraform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Terraform version
        id: version
        run: echo "value=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.version.outputs.value }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init (Dev, no backend)
        id: init
        run: terraform init -backend=false -lockfile=readonly -input=false
        working-directory: environments/dev

      - name: Terraform Validate (Dev)
        id: validate
        run: terraform validate -no-color
        working-directory: environments/dev

      # Summaries work for fork PRs without granting write permissions.
      - name: Validation summary
        if: always()
        env:
          FMT: ${{ steps.fmt.outcome }}
          INIT: ${{ steps.init.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
        run: |
          {
            echo '### Terraform validation (no Azure access)'
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Format | $FMT |"
            echo "| Init (backend disabled) | $INIT |"
            echo "| Validate | $VALIDATE |"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security Scan (report only)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli

  docs:
    name: Generate Docs
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Render terraform-docs
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: modules/app-infrastructure
          output-file: README.md
          output-method: inject
          git-push: "false"
