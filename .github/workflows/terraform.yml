name: Terraform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6
        with:
          tflint_version: v0.64.0
      - name: Initialize bundled rules
        run: tflint --init
      - name: Lint roots and modules (no Azure)
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  validate:
    name: Validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [environments/dev, environments/prod, bootstrap/backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Terraform version
        id: version
        run: echo "value=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.version.outputs.value }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        id: init
        run: terraform init -backend=false -lockfile=readonly -input=false
        working-directory: ${{ matrix.root }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.root }}

      - name: Tests (mock providers, no Azure)
        id: tests
        run: terraform test -no-color
        working-directory: ${{ matrix.root }}

      # Summaries work for fork PRs without granting write permissions.
      - name: Validation summary
        if: always()
        env:
          FMT: ${{ steps.fmt.outcome }}
          INIT: ${{ steps.init.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          {
            echo '### Terraform validation (no Azure access)'
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Format | $FMT |"
            echo "| Init (backend disabled) | $INIT |"
            echo "| Validate | $VALIDATE |"
            echo "| Tests (mocks) | $TESTS |"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security Scan (selected blocking checks)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Checkov
        run: python -m pip install -r .github/requirements-security.txt
      - name: Run Checkov
        run: checkov --directory . --config-file .checkov.yml

  docs:
    name: Generate Docs
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Render terraform-docs
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: modules/app-infrastructure
          output-file: README.md
          output-method: inject
          git-push: "false"
